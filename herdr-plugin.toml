id = "asumaran.asgotopr"
name = "asgotopr"
version = "0.13.0"
min_herdr_version = "0.7.5"
description = "Jump to your open GitHub PRs across local repos and worktrees"
platforms = ["linux", "macos"]

[[build]]
command = ["scripts/fetch-binary.sh"]

[[actions]]
id = "open"
title = "Open PR switcher"
contexts = ["global"]
command = ["scripts/open-pane.sh"]

[[panes]]
id = "picker"
title = "asgotopr"
placement = "popup"
width = "85%"
height = "90%"
command = ["./asgotopr"]
